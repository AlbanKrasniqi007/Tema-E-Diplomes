device: cuda
seed: 1

# AlphaZero / early Lc0 paper-scale SE-ResNet. Needs a long training run.
network:
  blocks: 10
  filters: 128
  se_channels: 32
  policy_head: convolution
  value_head: wdl
  mlh_channels: 8
  mlh_fc: 128

search:
  cpuct: 1.745
  cpuct_base: 38739.0
  cpuct_factor: 3.894
  fpu_strategy: reduction
  fpu_value: 0.330
  policy_softmax_temp: 1.61
  minibatch_size: 64
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  q_mode: asymmetric
  fpu_mode: negation

train:
  visits: 400
  temperature: 1.0
  temp_decay_moves: 30
  batch_size: 96
  learning_rate: 0.0005
  games_per_iteration: 16
  train_steps_per_iteration: 200
  replay_size: 40000
  opening_name: Berlin Defence
  opening_pgn: "1. e4 e5 2. Nf3 Nc6 3. Bb5 Nf6"
  opening_fen: r1bqkb1r/pppp1ppp/2n2n2/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4
  opening_moves:
    - e2e4
    - e7e5
    - g1f3
    - b8c6
    - f1b5
    - g8f6
